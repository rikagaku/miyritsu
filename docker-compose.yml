networks:
    miyritsu_net:
        driver: bridge
services:
    database:
        build: ./config
        networks:
            - miyritsu_net
        container_name: miyritsu_db
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: miyritsu
            MONGO_INITDB_DATABASE: miyritsu_db
            MONGO_REPLICA_HOST: miyritsu_db
            MONGO_REPLICA_PORT: 27017
        ports:
            - 27017:27017
    app:
        build: .
        user: miyritsu
        container_name: miyritsu_app
        ports:
            - 2129:2129
        volumes:
            - .:/app
        networks:
            - miyritsu_net
        depends_on:
            - database

        # Please, these values are only for development. Don't be an idiot.
        cap_add:
            - SYS_PTRACE
        security_opt:
            - seccomp=unconfined
volumes:
    miyritsu_vol:
